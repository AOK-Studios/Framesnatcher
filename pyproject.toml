[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "framesnatcher"
version = "0.1.0"
description = "Snatch high resolution frames from video, built for agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
framesnatcher = "framesnatcher.cli:main"

[tool.setuptools]
packages = ["framesnatcher"]
